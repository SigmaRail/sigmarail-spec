[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sigmarail-spec"
version = "0.2.0"
description = "Machine-readable SigmaRail data and strategy capability contract"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
build = ["PyYAML>=6", "sqlglot>=25"]
test = ["pytest>=8"]

[tool.setuptools.package-data]
sigmarail_spec = ["data/**/*.json", "data/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["sigmarail_spec*", "vera_spec*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
